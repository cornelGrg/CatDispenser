<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispenser Control</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }
        .box {
            border: 2px solid black;
            padding: 20px;
            margin: 10px;
            width: 250px;
            height: 80px;
            text-align: center;
            font-size: 24px;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sensor-reading {
            font-size: 24px;
            font-weight: bold;
            background: white;
            padding: 2px 10px;
            border: 1px solid black;
            min-width: 80px;
            text-align: right;
        }
        .sensor-reading::after {
            content: " g";
            font-size: 16px;
            font-weight: normal;
        }
        .input-group {
            margin: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .input-group label, .input-group input {
            width: 250px;
            text-align: center;
        }
        .button-group {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            width: 250px;
        }
        .button-group button {
            font-size: 18px;
            padding: 10px 20px;
            width: 48%;
        }
    </style>
</head>
<body>
<h1>Dispenser Control</h1>
<div class="box">Dispenser Scale <span class="sensor-reading" id="dispenser-reading">000.0</span></div>
<div class="box">Portion Scale <span class="sensor-reading" id="portion-reading">000.0</span></div>
<div class="input-group">
    <label for="dispense-time">Set Dispense Time:</label>
    <input type="text" id="dispense-time" name="dispense-time">
</div>
<div class="input-group">
    <label for="portion-size">Set Portion Size:</label>
    <input type="text" id="portion-size" name="portion-size">
</div>
<div class="button-group">
    <button onclick="dispense()">Dispense Now!</button>
    <button onclick="saveSettings()">Save Settings</button>
</div>

<script>
    // Function to fetch sensor readings from the ESP32
    async function updateSensorReadings() {
        try {
            const response = await fetch("/sensor-data");
            const data = await response.json();
            document.getElementById("dispenser-reading").textContent = data.dispenser.toFixed(1);
            document.getElementById("portion-reading").textContent = data.portion.toFixed(1);
        } catch (error) {
            console.error("Error fetching sensor data:", error);
        }
    }

    // Function to send dispense command to the ESP32
    async function dispense() {
        try {
            const response = await fetch("/dispense", { method: "POST" });
            const result = await response.text();
            alert(result);
        } catch (error) {
            console.error("Error dispensing:", error);
        }
    }

    // Function to save settings (dispense time and portion size) to the ESP32
    async function saveSettings() {
        const dispenseTime = document.getElementById("dispense-time").value;
        const portionSize = document.getElementById("portion-size").value;

        const data = {
            dispenseTime: dispenseTime,
            portionSize: parseFloat(portionSize)
        };

        try {
            const response = await fetch("/save-settings", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
            const result = await response.text();
            alert(result);
        } catch (error) {
            console.error("Error saving settings:", error);
        }
    }

    // Update sensor readings every 2 seconds
    setInterval(updateSensorReadings, 2000);
    window.onload = updateSensorReadings;
</script>
</body>
</html>
